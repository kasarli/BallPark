<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballpark · a guessing game</title>
<style>
  :root {
    --paper: #e8eff8;
    --ink: #101a33;
    --mute: #5a6785;
    --line: #c7d2e4;
    --card: #ffffff;
    --accent: #3d5afe;
    --win: #1fa971;
    --hot: #7bc043;
    --warm: #f5b82e;
    --cold: #e8466b;
    --orange: #ff8a1f;
    --red: #d7263d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
  .narrow { max-width: 540px; margin: 0 auto; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .logo { font-size: 38px; font-weight: 900; letter-spacing: -0.04em; margin: 0; cursor: pointer; }
  .pills { display: flex; gap: 8px; }
  .pill { background: var(--ink); color: #fff; font-weight: 700; padding: 6px 12px; border-radius: 999px; font-size: 15px; }

  h2.sec { font-size: 20px; font-weight: 900; margin: 30px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .blurb { font-size: 14px; color: var(--mute); margin: 0 0 14px; }
  .badge { display: inline-block; padding: 3px 12px; border: 3px solid var(--ink); font-size: 16px; }
  .b-Easy { background: var(--win); color: #fff; }
  .b-Medium { background: var(--warm); }
  .b-Hard { background: var(--orange); }
  .b-Impossible { background: var(--red); color: #fff; }
  .b-Abyss { background: #000; color: #fff; }

  /* buttons */
  button {
    font: inherit; font-weight: 800; font-size: 18px;
    padding: 10px 18px;
    background: var(--accent); color: #fff;
    border: 3px solid var(--ink);
    cursor: pointer;
    transition: transform .08s;
  }
  button:active { transform: translate(2px, 2px); }
  button.ghost { background: #fff; color: var(--ink); }
  button.small { font-size: 14px; padding: 6px 12px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* catalog tiles */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .grid.small { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .tile {
    display: block; width: 100%; text-align: left;
    background: #fff; color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 14px; font-size: 15px; font-weight: 400;
  }
  .tile.d-Easy { border-left-width: 12px; border-left-color: var(--win); }
  .tile.d-Medium { border-left-width: 12px; border-left-color: var(--warm); }
  .tile.d-Hard { border-left-width: 12px; border-left-color: var(--orange); }
  .tile.d-Impossible { border-left-width: 12px; border-left-color: var(--red); }
  .tile.d-Abyss { border-left-width: 12px; border-left-color: #000; }
  .tile:hover:not(.soon) { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .tile .top { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; color: var(--mute); }
  .tile .name { font-size: 22px; font-weight: 900; margin: 4px 0 10px; letter-spacing: -0.02em; }
  .tile ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.3; }
  .tile .hid { color: var(--mute); letter-spacing: .25em; font-weight: 800; }
  .tile.done { background: #effaf4; }
  .tile.daily { background: var(--accent); color: #fff; }
  .tile.daily .top { color: #dbe2ff; }
  .tile.soon { border-style: dashed; border-color: var(--mute); box-shadow: none; background: transparent; color: var(--mute); text-align: center; padding: 18px 10px; }
  .tile.soon .lock { font-size: 28px; }
  .tile.soon div + div { font-weight: 800; font-size: 14px; margin-top: 4px; }

  /* play screen */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; }
  .dots .now { background: var(--warm); }
  .dots .w { background: var(--win); }
  .dots .l { background: var(--cold); }

  .card { background: var(--card); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px; margin-bottom: 22px; }
  .meta { font-size: 14px; color: var(--mute); font-weight: 700; margin-bottom: 8px; }
  .question { font-size: 26px; font-weight: 800; line-height: 1.2; margin: 0 0 18px; }
  .entry { display: flex; gap: 10px; }
  input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 24px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 10px 12px;
    border: 3px solid var(--ink);
    background: #f7f9fd; color: var(--ink);
  }
  input:disabled { opacity: .5; }
  .tip { font-size: 13px; color: var(--mute); margin: 10px 0 0; min-height: 18px; }
  .tip.err { color: var(--cold); font-weight: 700; }
  .hint { margin-top: 10px; font-size: 14px; font-weight: 700; background: #fff6d6; border: 2px dashed var(--warm); padding: 8px 10px; }

  #guesses { display: grid; gap: 10px; margin-bottom: 22px; }
  .row {
    display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px;
    background: var(--card); border: 3px solid var(--ink);
    padding: 10px 12px; position: relative; overflow: hidden;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .row { animation: none; } .tile, button { transition: none; } }
  .row .n { font-weight: 800; color: var(--mute); }
  .row .num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .row .lab { font-size: 13px; font-weight: 700; color: var(--mute); }
  .row .arrow { font-size: 15px; font-weight: 900; padding: 4px 10px; border: 2px solid var(--ink); background: #fff; }
  .row.blind .arrow { background: #000; color: #fff; }
  .row .bar { position: absolute; left: 0; bottom: 0; height: 6px; }
  .win .bar, .win .arrow { background: var(--win); color: #fff; }
  .hot .bar { background: var(--hot); }
  .warm .bar { background: var(--warm); }
  .cold .bar { background: var(--cold); }

  .result h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  .answer { font-size: 36px; font-weight: 900; font-variant-numeric: tabular-nums; margin: 4px 0 8px; overflow-wrap: anywhere; }
  .fact { color: var(--mute); margin: 0 0 16px; line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; text-align: center; }
  .stats b { display: block; font-size: 26px; font-weight: 900; }
  .stats span { font-size: 12px; color: var(--mute); font-weight: 700; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .countdown { font-size: 13px; color: var(--mute); margin-top: 14px; font-weight: 700; }

  /* summary */
  .sumlist { list-style: none; margin: 14px 0 18px; padding: 0; display: grid; gap: 14px; }
  .sumlist li { border-left: 6px solid var(--line); padding-left: 12px; }
  .sumlist li.w { border-color: var(--win); }
  .sumlist li.l { border-color: var(--cold); }
  .sumlist .qq { font-weight: 800; }
  .sumlist .aa { color: var(--mute); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .bigstars { font-size: 34px; letter-spacing: 4px; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="logo" id="logo">Ballpark</h1>
    <div class="pills">
      <span class="pill" id="stars-pill">⭐ 0</span>
      <span class="pill" id="streak-pill">🔥 0</span>
    </div>
  </header>

  <!-- CATALOG -->
  <section id="home">
    <h2 class="sec">Today</h2>
    <button class="tile daily" id="daily-tile"></button>

    <div id="levels"></div>

    <h2 class="sec">Coming soon</h2>
    <div class="grid small" id="soon"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="narrow" hidden>
    <div class="topbar">
      <button class="ghost small" id="back">← Catalog</button>
      <div class="dots" id="dots"></div>
    </div>

    <div class="card">
      <div class="meta" id="meta"></div>
      <h2 class="question" id="question"></h2>
      <div class="entry">
        <input id="input" type="text" inputmode="decimal" autocomplete="off" placeholder="Your guess" aria-label="Your guess">
        <button id="guess">Guess</button>
      </div>
      <p class="tip" id="tip" aria-live="polite"></p>
      <p class="tip" id="note"></p>
      <div class="hint" id="hint" hidden></div>
    </div>

    <section id="guesses"></section>

    <section class="card result" id="result" hidden>
      <h2 id="verdict"></h2>
      <div class="answer" id="answer"></div>
      <p class="fact" id="fact"></p>
      <div class="stats" id="stats">
        <div><b id="s-played">0</b><span>Played</span></div>
        <div><b id="s-win">0%</b><span>Win rate</span></div>
        <div><b id="s-streak">0</b><span>Streak</span></div>
        <div><b id="s-best">0</b><span>Best</span></div>
      </div>
      <div class="actions">
        <button id="next-btn">Next question →</button>
        <button id="share" class="ghost">Copy result</button>
        <button id="to-cat" class="ghost">Catalog</button>
      </div>
      <div class="countdown" id="countdown"></div>
    </section>
  </section>

  <!-- LEVEL SUMMARY -->
  <section id="summary" class="narrow" hidden>
    <div class="card">
      <div class="meta" id="sum-meta"></div>
      <h2 class="question" id="sum-title"></h2>
      <div class="bigstars" id="sum-stars"></div>
      <ul class="sumlist" id="sum-list"></ul>
      <div class="actions">
        <button id="sum-share">Copy result</button>
        <button id="sum-replay" class="ghost">Replay level</button>
        <button id="sum-back" class="ghost">Catalog</button>
      </div>
    </div>
  </section>
</main>

    ]},
    { id: 26, diff: "Impossible", name: "Physics", emoji: "⚛️", qs: [
      { q: "How many atoms are in 12 grams of carbon-12?", a: 6.022e23, fact: "That's Avogadro's number." },
      { q: "How heavy is Earth, in kilograms?", a: 5.97e24, fact: "About 5.97 × 10²⁴ kg." },
      { q: "How heavy is the Sun, in kilograms?", a: 1.989e30, fact: "About 333,000 Earths." }
    ]},

    // ---------- ABYSS (no hints, only higher or lower) ----------
    { id: 32, diff: "Abyss", name: "Absurd counts", emoji: "🧮", qs: [
      { q: "How many valid completed Sudoku grids exist?", a: 6670903752021072936960, fact: "Exactly 6,670,903,752,021,072,936,960 grids." },
      { q: "How many legal positions are there on a 19x19 Go board?", a: 2.08e170, fact: "About 2.08 × 10¹⁷⁰, far more than the atoms in the universe." },
      { q: "Roughly how many atoms are in the observable universe?", a: 1e80, fact: "A common estimate is about 10⁸⁰." }
    ]},
    { id: 33, diff: "Abyss", name: "Concrete and iron", emoji: "🏗️", qs: [
      { q: "About how many rivets hold the Eiffel Tower together?", a: 2500000, fact: "Around 2.5 million rivets and 18,038 iron parts." },
      { q: "About how many bricks went into the Empire State Building?", a: 10000000, fact: "Roughly 10 million bricks, and it was finished in 1931." },
      { q: "About how many stone blocks make up the Great Pyramid of Giza?", a: 2300000, fact: "Roughly 2.3 million blocks." }
    ]},
    { id: 34, diff: "Abyss", name: "Holes and heights", emoji: "⛰️", qs: [
      { q: "How deep is the Kola Superdeep Borehole in Russia, in meters?", a: 12262, fact: "The deepest hole humans have drilled, reached in 1989." },
      { q: "How tall is Angel Falls in Venezuela, in meters?", a: 979, fact: "The world's tallest waterfall. Its longest unbroken drop is 807 m." },
      { q: "How long are the mapped passages of Mammoth Cave in Kentucky, in kilometers?", a: 685, fact: "The longest known cave system in the world." }
    ]},
    { id: 35, diff: "Abyss", name: "Brains and genes", emoji: "🧠", qs: [
      { q: "About how many neurons are in a human brain?", a: 86000000000, fact: "Around 86 billion." },
      { q: "How many neurons does the roundworm C. elegans have?", a: 302, fact: "It was the first animal to have its whole nervous system mapped." },
      { q: "About how many neurons are in a fruit fly's brain?", a: 139255, fact: "Mapped in full by the FlyWire project." }
    ]},
    { id: 36, diff: "Abyss", name: "Minecraft deep cuts", emoji: "⛏️", qs: [
      { q: "In old versions of Minecraft, how many blocks from the center did the Far Lands begin?", a: 12550821, fact: "Terrain generation broke down at 12,550,821 blocks." },
      { q: "How many blocks are in one chunk column in modern Minecraft (16 x 16 x 384)?", a: 98304, fact: "16 x 16 x 384 blocks." },
      { q: "How many different world seeds can Minecraft: Java Edition use?", a: 18446744073709551616, fact: "Seeds are 64-bit numbers, so there are 2⁶⁴ of them." }
    ]},
    { id: 37, diff: "Abyss", name: "Swedish deep cuts", emoji: "🇸🇪", qs: [
      { q: "How big is Lake Vänern, in square kilometers?", a: 5650, fact: "The largest lake in Sweden and the third-largest in Europe." },
      { q: "How long is the Göta Canal, in kilometers?", a: 190, fact: "It has 58 locks and was finished in 1832." },
      { q: "How long is the bridge section of the Öresund Bridge, in meters?", a: 7845, fact: "The link to Denmark also has a tunnel and an artificial island." }
    ]},
    { id: 38, diff: "Abyss", name: "Record speeds", emoji: "🦅", qs: [
      { q: "How fast was the fastest recorded dive of a peregrine falcon, in km/h?", a: 389, fact: "A diving falcon was clocked at 389 km/h." },
      { q: "How fast does the International Space Station orbit Earth, in km/h?", a: 27600, fact: "It circles the planet roughly every 90 minutes." },
      { q: "How fast is Voyager 1 moving away from the Sun, in km/h?", a: 61000, fact: "That's about 17 kilometers every second." }
    ]},
    { id: 39, diff: "Abyss", name: "Brick counts", emoji: "🧱", qs: [
      { q: "How many pieces are in the LEGO Titanic set?", a: 9090, fact: "The finished ship is about 135 cm long." },
      { q: "How many pieces are in the LEGO Eiffel Tower set (10307)?", a: 10001, fact: "It stands about 1.5 meters tall." },
      { q: "How many pieces are in the LEGO Art World Map set?", a: 11695, fact: "A mosaic of the world built from 11,695 pieces." }
    ]}
  ];

  // How many locked "coming soon" tiles to show (they have no questions yet)
  const COMING_COUNT = 16;

  // Stars you earn for each correct question in a level of that difficulty
  const starsPer = (diff) => DIFFS.find((d) => d.name === diff).stars;
  const isBlind = (diff) => !!DIFFS.find((d) => d.name === diff).blind;

  // The daily question skips the Impossible and Abyss levels
  const DAILY_POOL = LEVELS.filter((l) => l.diff !== "Impossible" && l.diff !== "Abyss").flatMap((l) => l.qs);
  const MAX = 6;
  const KEY = "ballpark:v2";

  // ============ helpers ============
  const $ = (s) => document.querySelector(s);
  const fmt = (n) => Number(n).toLocaleString("en-US", { maximumFractionDigits: 3 });
  const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };

  // numbers at or above a quadrillion show as 8.1 × 10⁶⁷
  function num(n) {
    if (n >= 1e15) {
      const e = Math.floor(Math.log10(n));
      const m = Number((n / Math.pow(10, e)).toPrecision(3));
      return m + " × 10" + String(e).split("").map((c) => SUP[c]).join("");
    }
    return fmt(n);
  }

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  const store = load();
  store.stats = store.stats || { played: 0, wins: 0, streak: 0, best: 0, lastWin: 0 };
  store.progress = store.progress || {};

  // day number counts from Jan 1 2026, in your local time (used for the daily question)
  const epoch = new Date(2026, 0, 1);
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const DAY = Math.round((startToday - epoch) / 86400000) + 1;
  const TODAY_LABEL = startToday.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const dailyQ = DAILY_POOL[(DAY * 7) % DAILY_POOL.length];
  const DAILY_KEY = "daily:" + DAY;

  // "5k", "2.5m", "3b", "1,000,000", "6e24" -> number
  function parse(text) {
    const t = text.trim().toLowerCase().replace(/[,\s_]/g, "");
    const m = t.match(/^(\d*\.?\d+)(k|m|b|t)?$/);
    if (m) return parseFloat(m[1]) * ({ k: 1e3, m: 1e6, b: 1e9, t: 1e12 }[m[2]] || 1);
    const n = Number(t);
    return Number.isFinite(n) ? n : NaN;
  }

  // big numbers (1,000+) are shown rounded to 2 significant digits, like 93 billion
  const targetOf = (a) => (a >= 1000 ? Number(a.toPrecision(2)) : a);

  // win = within 10% of the answer, hot = within 2x, warm = within 10x
  function grade(v, rawA) {
    const a = targetOf(rawA);
    const d = Math.abs(Math.log10(v / a));
    let tier = "cold";
    if (d <= Math.log10(1.1)) tier = "win";
    else if (d <= Math.log10(2)) tier = "hot";
    else if (d <= 1) tier = "warm";
    return { tier, up: v < a, closeness: Math.max(4, Math.round((1 - Math.min(d, 3) / 3) * 100)) };
  }

  const LABELS = { win: "Spot on!", hot: "Close, within 2×", warm: "Warm, within 10×", cold: "Cold, over 10× off" };
  const EMOJI = { win: "🎯", hot: "🟩", warm: "🟨", cold: "🟥" };

  // ============ screens ============
  let sess = null; // the level or daily question being played

  function show(name) {
    ["home", "play", "summary"].forEach((id) => { $("#" + id).hidden = id !== name; });
    refreshPills();
    window.scrollTo(0, 0);
  }

  function totalStars() {
    let n = 0;
    LEVELS.forEach((lv) => {
      const items = store.progress["level:" + lv.id];
      if (items) n += items.filter((x) => x.done && x.won).length * starsPer(lv.diff);
    });
    return n;
  }

  function refreshPills() {
    const s = store.stats;
    const live = s.lastWin === DAY || s.lastWin === DAY - 1 ? s.streak : 0;
    $("#stars-pill").textContent = "⭐ " + totalStars();
    $("#streak-pill").textContent = "🔥 " + live;
  }

  // ---------- catalog ----------
  function levelTile(lv, n) {
    const items = store.progress["level:" + lv.id];
    const idx = items ? items.findIndex((x) => !x.done) : -1;
    const finished = items && idx === -1;
    const revealed = !items ? 0 : finished ? 3 : idx + 1;
    const wins = items ? items.filter((x) => x.done && x.won).length : 0;

    const per = starsPer(lv.diff);
    let status = "New";
    if (finished) status = "⭐ " + wins * per + "/" + 3 * per;
    else if (items) status = "In progress";

    // questions stay hidden (???) until you reach them
    const lines = lv.qs.map((q, j) => {
      if (j >= revealed) return '<li class="hid">???</li>';
      const mark = items[j].done ? (items[j].won ? "✅" : "❌") : "▶";
      return "<li>" + mark + " " + q.q + "</li>";
    }).join("");

    return '<button class="tile d-' + lv.diff + (finished ? " done" : "") + '" data-level="' + lv.id + '">' +
      '<div class="top"><span>' + lv.diff + " " + n + '</span><span>' + status + '</span></div>' +
      '<div class="name">' + lv.emoji + " " + lv.name + '</div>' +
      "<ul>" + lines + "</ul></button>";
  }

  function renderHome() {
    show("home");

    // daily tile
    const dItems = store.progress[DAILY_KEY];
    const dDone = dItems && dItems[0].done;
    if (dDone) {
      $("#daily-tile").innerHTML =
        '<div class="top"><span>Daily · ' + TODAY_LABEL + '</span><span>' + (dItems[0].won ? "✅ Solved" : "❌ Missed") + '</span></div>' +
        '<div class="name">' + dailyQ.q + '</div>' +
        '<div>Tap to see your result</div>';
    } else {
      $("#daily-tile").innerHTML =
        '<div class="top"><span>Daily · ' + TODAY_LABEL + '</span><span>1 question</span></div>' +
        '<div class="name">Today\'s question</div>' +
        '<div>New every day. Six guesses.</div>';
    }

    // one section per difficulty
    $("#levels").innerHTML = DIFFS.map((d) => {
      const list = LEVELS.filter((l) => l.diff === d.name);
      return '<h2 class="sec"><span class="badge b-' + d.name + '">' + d.name + '</span></h2>' +
        '<p class="blurb">' + d.blurb + ' Worth ' + d.stars + ' ⭐ per question.</p>' +
        '<div class="grid">' + list.map((lv, i) => levelTile(lv, i + 1)).join("") + '</div>';
    }).join("");

    // coming soon: locked, no names
    let soon = "";
    for (let i = 0; i < COMING_COUNT; i++) {
      soon += '<div class="tile soon"><div class="lock">🔒</div><div>Coming soon</div></div>';
    }
    $("#soon").innerHTML = soon;
  }

  // ---------- starting a daily or level ----------
  function openSession(kind, key, title, qs, opts) {
    const o = opts || {};
    let items = store.progress[key];
    if (!items) {
      items = qs.map(() => ({ guesses: [], done: false, won: false }));
      store.progress[key] = items;
      save();
    }
    sess = { kind, key, title, qs, items, pos: 0, per: o.per || 0, blind: !!o.blind };
    const idx = items.findIndex((x) => !x.done);
    if (idx === -1 && kind === "level") { renderSummary(); return; }
    sess.pos = idx === -1 ? 0 : idx;
    $("#input").value = "";
    renderPlay();
  }

  function openLevel(id) {
    const lv = LEVELS.find((l) => l.id === id);
    openSession("level", "level:" + id, lv.emoji + " " + lv.name, lv.qs, { per: starsPer(lv.diff), blind: isBlind(lv.diff) });
  }
  function openDaily() { openSession("daily", DAILY_KEY, "Daily", [dailyQ]); }

  // ---------- playing ----------
  function setTip(text, isError) {
    $("#tip").textContent = text;
    $("#tip").className = "tip" + (isError ? " err" : "");
  }

  function hintText(q, item) {
    if (item.done || sess.blind) return "";
    const n = item.guesses.length;
    const a = targetOf(q.a);
    const digits = Math.floor(Math.log10(a)) + 1;
    const d = digits + " digit" + (digits === 1 ? "" : "s");
    if (n >= 5) return "Hint: the answer has " + d + " and starts with " + String(a)[0] + ".";
    if (n >= 3) return "Hint: the answer has " + d + ".";
    return "";
  }

  function renderPlay() {
    show("play");
    const q = sess.qs[sess.pos];
    const item = sess.items[sess.pos];
    const daily = sess.kind === "daily";

    $("#meta").textContent = daily
      ? "Daily · " + TODAY_LABEL + " · " + MAX + " guesses"
      : sess.title + " · Question " + (sess.pos + 1) + " of " + sess.qs.length;
    $("#question").textContent = q.q;
    $("#note").textContent = q.a >= 1e15
      ? "Huge number: type it like 6e24. Within 10% counts as correct."
      : q.a >= 1000 ? "Big number: within 10% counts as correct." : "";

    $("#dots").innerHTML = daily ? "" : sess.items.map((x, i) => {
      const cls = x.done ? (x.won ? "w" : "l") : i === sess.pos ? "now" : "";
      return '<span class="' + cls + '"></span>';
    }).join("");

    $("#guesses").innerHTML = item.guesses.map((v, i) => {
      const g = grade(v, q.a);
      const arrow = g.tier === "win" ? "✓" : g.up ? "▲ higher" : "▼ lower";
      const hide = sess.blind && g.tier !== "win"; // Abyss: only higher or lower
      return '<div class="row ' + (hide ? "blind" : g.tier) + '">' +
        '<span class="n">' + (i + 1) + '</span>' +
        '<div><div class="num">' + num(v) + '</div>' + (hide ? "" : '<div class="lab">' + LABELS[g.tier] + '</div>') + '</div>' +
        '<span class="arrow">' + arrow + '</span>' +
        (hide ? "" : '<span class="bar" style="width:' + g.closeness + '%"></span>') + '</div>';
    }).join("");

    $("#input").disabled = item.done;
    $("#guess").disabled = item.done;
    if (!item.done) setTip("Guess " + (item.guesses.length + 1) + " of " + MAX + (sess.blind ? ". No hints, only higher or lower" : "") + ". Tip: type 5k, 2.5m, 3b or 6e24.");

    const hint = hintText(q, item);
    $("#hint").hidden = !hint;
    $("#hint").textContent = hint;

    $("#result").hidden = !item.done;
    if (item.done) {
      const s = store.stats;
      const live = s.lastWin === DAY || s.lastWin === DAY - 1 ? s.streak : 0;
      $("#verdict").textContent = item.won ? "Nailed it in " + item.guesses.length + "!" + (sess.per ? " +" + sess.per + " ⭐" : "") : "Not this time";
      $("#answer").textContent = num(targetOf(q.a));
      $("#fact").textContent = q.fact;
      $("#stats").hidden = !daily;
      $("#s-played").textContent = s.played;
      $("#s-win").textContent = (s.played ? Math.round((s.wins / s.played) * 100) : 0) + "%";
      $("#s-streak").textContent = live;
      $("#s-best").textContent = s.best;
      $("#next-btn").hidden = daily;
      $("#next-btn").textContent = sess.pos < sess.qs.length - 1 ? "Next question →" : "See results →";
      $("#share").hidden = !daily;
      $("#countdown").hidden = !daily;
    } else {
      $("#input").focus();
    }
  }

  function submit() {
    const item = sess.items[sess.pos];
    const q = sess.qs[sess.pos];
    if (item.done) return;
    const v = parse($("#input").value);
    if (!(v > 0)) { setTip("Enter a positive number, like 5000, 5k or 2.5m.", true); return; }

    item.guesses.push(v);
    $("#input").value = "";
    if (grade(v, q.a).tier === "win") { item.won = true; item.done = true; }
    else if (item.guesses.length >= MAX) { item.done = true; }

    if (item.done && sess.kind === "daily") updateStats(item.won);
    save();
    renderPlay();
  }

  function updateStats(won) {
    const s = store.stats;
    s.played++;
    if (won) {
      s.wins++;
      s.streak = s.lastWin === DAY - 1 ? s.streak + 1 : 1;
      s.lastWin = DAY;
      s.best = Math.max(s.best, s.streak);
    } else {
      s.streak = 0;
    }
  }

  function nextQuestion() {
    if (sess.pos < sess.qs.length - 1) {
      sess.pos++;
      $("#input").value = "";
      renderPlay();
    } else {
      renderSummary();
    }
  }

  // ---------- level summary ----------
  function renderSummary() {
    show("summary");
    const wins = sess.items.filter((x) => x.won).length;
    $("#sum-meta").textContent = "Level complete";
    $("#sum-title").textContent = sess.title;
    $("#sum-stars").textContent = "⭐ " + wins * sess.per + " / " + sess.qs.length * sess.per;
    $("#sum-list").innerHTML = sess.qs.map((q, i) => {
      const it = sess.items[i];
      return '<li class="' + (it.won ? "w" : "l") + '">' +
        '<div class="qq">' + q.q + '</div>' +
        '<div class="aa">Answer: ' + num(targetOf(q.a)) + " · " + (it.won ? "solved in " + it.guesses.length : "missed") + '</div></li>';
    }).join("");
  }

  // ---------- sharing ----------
  function gridLine(item, q) {
    return item.guesses.map((v) => {
      const g = grade(v, q.a);
      const e = sess.blind && g.tier !== "win" ? "" : EMOJI[g.tier];
      return e + (g.tier === "win" ? "" : g.up ? "⬆️" : "⬇️");
    }).join("");
  }

  function shareText() {
    if (sess.kind === "daily") {
      const it = sess.items[0];
      const rows = it.guesses.map((v) => {
        const g = grade(v, dailyQ.a);
        return EMOJI[g.tier] + (g.tier === "win" ? "" : g.up ? "⬆️" : "⬇️");
      }).join("\n");
      return "Ballpark " + TODAY_LABEL + " " + (it.won ? it.guesses.length : "X") + "/" + MAX + "\n" + rows;
    }
    const wins = sess.items.filter((x) => x.won).length;
    return "Ballpark · " + sess.title + " ⭐" + wins * sess.per + "/" + sess.qs.length * sess.per + "\n" +
      sess.items.map((it, i) => "Q" + (i + 1) + " " + gridLine(it, sess.qs[i])).join("\n");
  }

  async function copyResult(btn) {
    const text = shareText();
    const old = btn.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const t = document.createElement("textarea");
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      t.remove();
    }
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = old; }, 1500);
  }

  // countdown to the next daily question (local midnight)
  function tick() {
    const ms = new Date(startToday.getTime() + 86400000) - new Date();
    if (ms <= 0) { location.reload(); return; }
    const p = (n) => String(n).padStart(2, "0");
    $("#countdown").textContent = "Next daily in " + p(Math.floor(ms / 3600000)) + ":" + p(Math.floor(ms / 60000) % 60) + ":" + p(Math.floor(ms / 1000) % 60);
  }

  // ============ wire up ============
  $("#levels").addEventListener("click", (e) => {
    const tile = e.target.closest("[data-level]");
    if (tile) openLevel(Number(tile.dataset.level));
  });
  $("#daily-tile").addEventListener("click", openDaily);
  $("#guess").addEventListener("click", submit);
  $("#input").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  $("#next-btn").addEventListener("click", nextQuestion);
  $("#share").addEventListener("click", (e) => copyResult(e.currentTarget));
  $("#to-cat").addEventListener("click", renderHome);
  $("#back").addEventListener("click", renderHome);
  $("#logo").addEventListener("click", renderHome);
  $("#sum-back").addEventListener("click", renderHome);
  $("#sum-share").addEventListener("click", (e) => copyResult(e.currentTarget));
  $("#sum-replay").addEventListener("click", () => {
    delete store.progress[sess.key];
    save();
    openSession(sess.kind, sess.key, sess.title, sess.qs, { per: sess.per, blind: sess.blind });
  });

  setInterval(tick, 1000);
  tick();
  renderHome();
</script>
</body>
</html>
